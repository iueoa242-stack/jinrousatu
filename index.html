<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* [名前, 画像名, チーム(0村人/1人狼), 村の外カードを見る枚数, 2人村の説明, 3人村の説明] */
const R=[
['のんびり村人','のんびり村人',0,0,'のんびり屋の男の子（村人チーム）。能力はなく、村の外カードも見られません。話し合いと「あくしゅ／まもる」の読み合いで勝負します。','のんびり屋の男の子（村人チーム）。能力はなく、村の外カードも見られません。話し合いと「あくしゅ／まもる」の読み合いで勝負します。'],
['てーん村人','てーん村人',0,0,'おてんばな女の子（村人チーム）。能力はなく、村の外カードも見られません。話し合いと「あくしゅ／まもる」の読み合いで勝負します。','おてんばな女の子（村人チーム）。能力はなく、村の外カードも見られません。話し合いと「あくしゅ／まもる」の読み合いで勝負します。'],
['占い師','占い師',0,2,'村人チーム。村の外カード3枚のうち2枚を見られます。見たカードが分かると、相手の役職を絞り込めます。','村人チーム。村の外カード3枚のうち2枚を見られます。見たカードが分かると、2人の役職を絞り込めます。'],
['占い師の弟子','占い師の弟子',0,1,'村人チーム。村の外カード3枚のうち1枚を見られます。占い師より情報が少ないので、話し合いで補いましょう。','村人チーム。村の外カード3枚のうち1枚を見られます。占い師より情報が少ないので、話し合いで補いましょう。'],
['見習い魔女','見習い魔女',0,0,'村人チーム。相手を変身させます。村人チームの相手は「変身人狼」、人狼チームの相手は「変身村人」になり、相手は結果発表まで気づきません。元人狼の「変身村人」とあくしゅすると魔女が+2点！人狼親方と魔法使いには効きません。','村人チーム。変身させる相手を1人選びます。村人チームの相手は「変身人狼」、人狼チームの相手は「変身村人」になり、本人は結果発表まで気づきません。元人狼の「変身村人」とあくしゅすると魔女が+2点！人狼親方と魔法使いには効きません。'],
['魔法使い','魔法使い',0,1,'村人チーム。村の外カードを1枚見て、そのカードと自分のカードを入れ替えます。得点は入れ替えたあとの役職で計算されます（入れ替えた役職の能力は使えません）。見習い魔女の変身は効きません。','村人チーム。村の外カードを1枚見て、そのカードと自分のカードを入れ替えます。得点は入れ替えたあとの役職で計算されます（入れ替えた役職の能力は使えません）。見習い魔女の変身は効きません。'],
['狼少年','狼少年',0,1,'村人チーム。村の外カードを1枚見られます。人狼チームともあくしゅでき、お互い+1点。村人チームとあくしゅすると相手だけ+1点（自分は0点）。村の外にあるときは、セットされた人狼チームのカードに見えます。','村人チーム。村の外カードを1枚見られます。人狼チームともあくしゅでき、お互い+1点。村人チームとあくしゅすると相手だけ+1点（自分は0点）。村の外にあるときは、セットされた人狼チームのカードに見えます。'],
['狼男','狼男村人',0,1,'村の外カードを1枚見られます。ふだんは村人チームですが、50%の確率で人狼の姿になり、人狼チームとして扱われます。魔女に変身させられると、村人の姿は人狼に、人狼の姿は村人になります。','村の外カードを1枚見られます。ふだんは村人チームですが、50%の確率で人狼の姿になり、人狼チームとして扱われます。魔女に変身させられると、村人の姿は人狼に、人狼の姿は村人になります。'],
['人狼','人狼',1,1,'人狼チーム。村の外カードを1枚見られます。村人とあくしゅすると+2点。村人のふりをして上手くあくしゅを取りましょう。','人狼チーム。村の外カードを1枚見られます。村人とあくしゅすると+2点。村人のふりをして上手くあくしゅを取りましょう。'],
['人狼先輩','人狼先輩',1,2,'人狼チーム。村の外カードを2枚見られます。村人に「まもる」を選ばれると失点が大きく、村人が+2点もらいます。','人狼チーム。村の外カードを2枚見られます。村人に「まもる」を選ばれると失点が大きく、村人が+2点もらいます（ペアごとに適用）。'],
['人狼親方','人狼親方',1,3,'人狼チーム。村の外カードを3枚すべて見られます。村人に「まもる」を選ばれると村人が+2点、お互いに「まもる」でも村人に+1点入ります。魔女の変身は効きません。','人狼チーム。村の外カードを3枚すべて見られます。村人に「まもる」を選ばれると村人が+2点、お互いに「まもる」でも村人に+1点入ります（ペアごとに適用）。魔女の変身は効きません。'],
['人狼マジシャン','人狼マジシャン',1,1,'人狼チーム。村の外カードを1枚見られます。あくしゅの時間に、相手が「あくしゅ」を選んでいたら「まもる」に、「まもる」なら「あくしゅ」に変えてしまいます。','人狼チーム。村の外カードを1枚見られます。あくしゅの時間に1人を選ぶと、その人の2つの選択（あくしゅ／まもる）が逆になります。'],
['人狼魔法使い','人狼魔法使い',1,1,'人狼チーム。村の外カードを1枚見られます。相手が村の外カードを見られる役職なら、最初にめくるカードを人狼魔法使いのカード（幻）に見せかけます。','人狼チーム。村の外カードを1枚見られます。村の外カードを見られる他のプレイヤー全員に、最初にめくるカードを人狼魔法使いのカード（幻）に見せかけます。'],
['助言者','白の助言者',0,0,'オンライン対戦・3人村専用の役職です。','オンライン・3人村限定。引いたとき50%で「白の助言者」（村人チーム／のんびり村人と同じ）か「黒の助言者」（人狼チーム／人狼と同じ。村の外カードを1枚見られる）になります。話しあい中、特定の1人に12文字以内の「助言」を合計3回まで送れます。受け取った人は誰からか分かりません。一度送ると、その人にしか送れなくなります。'],
['天使/悪魔','天使と悪魔',0,0,'引いたとき、天使か悪魔かを自分で選びます。天使は村人チーム（のんびり村人と同じ）で、場にいる人狼の人数を知ります。悪魔は人狼チーム（人狼親方と同じ）で、村の外カード3枚をすべて見られ、場にいる市民の人数を知ります。悪魔には魔女の変身が効きません。','引いたとき、天使か悪魔かを自分で選びます。天使は村人チーム（のんびり村人と同じ）で、場にいる人狼の人数を知ります。悪魔は人狼チーム（人狼親方と同じ）で、村の外カード3枚をすべて見られ、場にいる市民の人数を知ります。悪魔には魔女の変身が効きません。']];
const COL=['#e0506a','#3f7fd0','#2f9e6a'],ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},MEMO=500,MP=['turn','talk','vote','shake'];
let G=null,mode='off',view='title',n=2,me=0,isHost=true,ready=false,ch={},tEnd=0,memo='',hist={},names=['','',''],opt={vote:0,time:180,m6:0},pick=[],peers=[],conn=null,gname='',jroom='',jerr='',rerr='',room='',pr=null,lv='',jst=0,lg=0,ltk=0,mg=null,wt=null,st=0,vi=0,lastR=0,rfr=0,rl3=0,rlt=0,ad=null,adL=0,rvm=[],advT=null,advTxt='',lp='',ADALL=false;
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const bi=new Image();bi.onerror=()=>$('#st').classList.add('nb');bi.src='images/Background.png';
const IMG=(r,v)=>r==7?(v&&G.wfm?'狼男人狼':'狼男村人'):r==13?(v==2?(G.advB?'黒の助言者':'白の助言者'):'助言者セット'):r==14?'天使と悪魔':R[r][1];
const fb=e=>{if(e.dataset.a){const a=e.dataset.a;delete e.dataset.a;e.src='images/'+a+'.png'}else{const d=document.createElement('span');d.className='fb';d.textContent=e.dataset.n;e.replaceWith(d)}};
/* v: 未指定=伏せ状態 / 1=村の外カードなどで狼男の姿を表示 / 2=本人のカード・結果発表（助言者の白/黒も表示）。助言者は2以外では「助言者セット」画像 */
const card=(r,s,v)=>r<0?`<div class="cd back ${s||''}"><img src="images/hatenacard.png" draggable="false"></div>`:`<div class="cd ${s||''}"><img src="images/${IMG(r,v)}.png" draggable="false" data-n="${IMG(r,v)}" onerror="fb(this)"></div>`;
const hd=()=>`<div class="hd"><span>${G?`<button class="btn sm x" onclick="modal(QT(),1)">中断</button>`:''}</span><span><a onclick="rlm()">役職</a><a onclick="modal(PT())">ポイント表</a></span></div>`,bot=x=>`<div class="bot">${x}</div>`,wait=t=>`<h2>${t}</h2>`;
const pub=z=>{if(!G.m6)return G.pool.map(r=>card(r,z)).join('');return [...G.sel].sort((a,b)=>a-b).map(r=>card(r,z)).concat(Array(Math.max(0,G.n+3-G.sel.length)).fill(card(-1,z))).join('')};
function modal(x,nc){$('#md').innerHTML=`<div class="mk" onclick="if(event.target==this)$('#md').innerHTML=''"><div class="mc">${x}${nc?'':'<button class="btn sm" onclick="$(\'#md\').innerHTML=\'\'">とじる</button>'}</div></div>`}
const QT=()=>`<h3>中断しますか？</h3><p>ホームに戻り、ゲームは終了します。</p><div class="row"><button class="btn sm r" onclick="quit()">はい</button><button class="btn sm x" onclick="$('#md').innerHTML=''">いいえ</button></div>`;
function quit(){peers.forEach(p=>{try{p&&p.dc.close()}catch(e){}});peers=[];if(pr){try{pr.destroy()}catch(e){}pr=null}if(conn){try{conn.close()}catch(e){}conn=null}G=null;view='title';mode='off';isHost=true;ready=false;ch={};st=0;vi=0;rvm=[];ad=null;adL=0;advT=null;advTxt='';mg=wt=null;memo='';hist={};lg=0;ltk=0;jst=0;jerr='';rerr='';room='';$('#md').innerHTML='';render()}
const tb=a=>`<table>${a.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`;
const PTT=()=>`<h3>ポイント表</h3>${G?`<p>現在：${G.names.map((x,i)=>x+' '+G.tot[i]+'点').join(' ／ ')}</p>`:''}<b>互いにあくしゅ</b>${tb([['村人チーム×村人チーム','互いに+1'],['人狼チーム×村人チーム','人狼に+2'],['人狼チーム×人狼チーム','互いに+1'],['見習い魔女×変身村人（元人狼）','魔女+2／変身村人+1']])}<b>まもるを選んだ場合</b>${tb([['村人のまもる×村人のあくしゅ','あくしゅ側+1'],['村人のまもる×人狼のあくしゅ','村人側+1'],['村人のまもる×人狼先輩・親方のあくしゅ','村人チーム+2'],['人狼のまもる×村人のあくしゅ','互いに0'],['人狼のまもる×人狼のあくしゅ','あくしゅ側+1'],['まもる×まもる','互いに0'],['村人のまもる×人狼親方のまもる','村人+1']])}<b>狼少年がいるペア</b>${tb([['あくしゅ×人狼チームのあくしゅ','互いに+1'],['あくしゅ×村人チームのあくしゅ','村人チーム+1'],['まもる×人狼チームのあくしゅ','互いに0']])}<b>投票（ONのとき）</b>${tb([['3人：的中','指名した人+1'],['3人：外れ','指名された人+1'],['3人：潜伏成功','その人+1'],['2人：的中','+1（外れは疑われた側+1）']])}<p>3ゲーム目と5ゲーム目は得点2倍。</p><b>新役職の扱い</b>${tb([['天使','のんびり村人と同じ'],['悪魔','人狼親方と同じ'],['白の助言者','村人チーム（のんびり村人と同じ）'],['黒の助言者','人狼チーム（人狼と同じ）']])}`;
function RLV(){const S=G?(G.m6?G.sel:[]):(opt.m6?pick:[]);
 return `<h3>役職説明</h3><div class="row">3人村 <button class="btn sm ${rl3?'':'x'}" onclick="rl3=1;modal(RLV())">ON</button><button class="btn sm ${rl3?'x':''}" onclick="rl3=0;modal(RLV())">OFF</button></div><div class="row"><button class="btn sm ${rlt?'x':''}" onclick="rlt=0;modal(RLV())">村人役職</button><button class="btn sm ${rlt?'':'x'}" onclick="rlt=1;modal(RLV())">人狼役職</button></div>`+(S.length?'<small>赤い枠は、選択した役職です（枠のないものはランダム抽選）</small>':'')+R.map((x,i)=>(i>=13?(i==14||rl3):x[2]==rlt)?`<div class="rr ${S.includes(i)?'rd':''}">${card(i,'s')}<div><b>${x[0]}</b><br>${rl3?x[5]:x[4]}</div></div>`:'').join('')}
function rlm(){rl3=G?G.n==3:n==3;modal(RLV())}
const combos=(a,k,st0=0,c=[],o=[])=>{if(c.length==k){o.push([...c]);return o}for(let i=st0;i<a.length;i++){c.push(a[i]);combos(a,k,i+1,c,o);c.pop()}return o};
const feS=S=>{const W=S.filter(r=>R[r][2]).length,F=S.filter(r=>r==7||r==13).length;return W+F>=1&&W<=3-(S.includes(14)?1:0)};
const wolfC=r=>!!(R[r][2]||(r==7&&G.wfm)||(r==13&&G.advB));
const Kv=r=>r==13?(G.advB?1:0):r==14?3:R[r][3];
const RN=r=>r==13?(G.advB?'黒の助言者':'白の助言者'):r==14?(adL?(ad==1?'悪魔':'天使'):'天使/悪魔'):R[r][0];
const adCnt=(cur,dv)=>G.roles0.filter((x,i)=>i!=cur).concat(ADALL?G.ctr0:[]).filter(x=>dv?!wolfC(x):wolfC(x)).length;
